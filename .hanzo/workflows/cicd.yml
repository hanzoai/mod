name: CI/CD

# The caller, and deliberately nothing else: triggers plus the import. All real
# config is the repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# `.hanzo/workflows`, NOT `.github/workflows`: the `git-runner` StatefulSet
# registers against the forge only, and that is the pool advertising the
# `hanzo-build-linux-amd64` label. A job asking for it on github.com is never
# claimed — it waits out the timeout rather than failing.

on:
  push:
    branches: [main]
    # A `v*` tag is a RELEASE and publishes an image named after it, verbatim.
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    # Pinned to the immutable tag, not the `v1` alias, because this repo is the
    # canary for ci v1.0.75 — the release that stopped `gover` reading a
    # two-part `go` directive as a demand for the newest patch. The alias moves
    # once this run is green.
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1.0.75
    secrets: inherit
